name: "Create release"

on:
  workflow_dispatch:
    inputs:
      versionType:
        description: "Quel type de version ?"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      # Récupération de tout l'historique git pour le calcul de la release
      - name: "Checkout source code"
        uses: "actions/checkout@v6"
        with:
          fetch-depth: "0"
          token: ${{ secrets.TOKEN_GITHUB_FOR_GITHUB_ACTION }}

      # Configuration de l'environnement Python
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Installation de Poetry pour la gestion des versions dans pyproject.toml
      - name: "Install Poetry"
        run: |
          if ! command -v poetry &> /dev/null; then
            pip install poetry
          fi

      # Calcul de la version suivante (release et snapshot) basée sur le dernier tag SemVer
      - name: "Calculate versions"
        id: calculate-version
        run: |
          versionType="${{ inputs.versionType }}"
          latestTag=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "Latest tag: $latestTag"

          if [[ -z "$latestTag" ]]; then
            echo "No tag found, using 0.0.0 as base"
            latestTag="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "$latestTag"

          if [[ "$versionType" == "major" ]]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [[ "$versionType" == "minor" ]]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          releaseVersion="${major}.${minor}.${patch}"
          snapshotVersion="${major}.${minor}.$((patch + 1))-SNAPSHOT"

          echo "releaseVersion=$releaseVersion" >> $GITHUB_OUTPUT
          echo "snapshotVersion=$snapshotVersion" >> $GITHUB_OUTPUT

          echo "New tag: $releaseVersion"
          echo "New Snapshot tag: $snapshotVersion"

      # Vérification de sécurité : release autorisée uniquement sur main ou master
      - name: 'Verify release is created only on "main" or "master" git branch'
        run: |
          CURRENT_GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: $CURRENT_GIT_BRANCH"
          [[ "$CURRENT_GIT_BRANCH" == "main" || "$CURRENT_GIT_BRANCH" == "master" ]] && exit 0 || exit 1

      # Vérification du format de version SemVer
      - name: "Verify version is correctly formatted (X.X.X)"
        env:
          NEW_TAG: ${{ steps.calculate-version.outputs.releaseVersion }}
        run: |
          echo $NEW_TAG | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'

      # Vérification de l'unicité du tag
      - name: "Verify version is not already used as a git tag"
        env:
          NEW_TAG: ${{ steps.calculate-version.outputs.releaseVersion }}
        run: |
          [[ "$(git tag --list | grep $NEW_TAG)" == "" ]] && exit 0 || exit 1

      # Vérification du format de version SNAPSHOT
      - name: "Verify snapshot version is formatted (X.X.X-SNAPSHOT)"
        env:
          NEW_SNAPSHOT_TAG: ${{ steps.calculate-version.outputs.snapshotVersion }}
        run: |
          echo $NEW_SNAPSHOT_TAG | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$'

      # Génération de la version : mise à jour pyproject.toml, README.md, commits, tags, merge develop et PR
      - name: "Generate the new version (update files + git tag)"
        env:
          NEW_TAG: ${{ steps.calculate-version.outputs.releaseVersion }}
          NEW_SNAPSHOT_TAG: ${{ steps.calculate-version.outputs.snapshotVersion }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB_FOR_GITHUB_ACTION }}
        run: |
          git config --global user.email "github-action@noreply"
          git config --global user.name "Github Action"

          # Récupérer dynamiquement le nom de la branche courante (main ou master)
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch is $CURRENT_BRANCH"

          # S'assurer que la branche locale est parfaitement à jour avec le dépôt distant
          git pull origin $CURRENT_BRANCH --rebase

          # 1. Mise à jour de la version de release dans pyproject.toml et README.md
          poetry version $NEW_TAG || sed -i "s#^version = \".*\"#version = \"$NEW_TAG\"#g" pyproject.toml
          sed -i "s#Version: [0-9]\+\.[0-9]\+\.[0-9]\+\(-SNAPSHOT\)\?#Version: $NEW_TAG#g" README.md

          # 2. Validation et publication de la version de release.
          # Note : On évite 'git commit --amend' suivi d'un simple 'git push' car cela
          # réécrit l'historique local après avoir poussé le tag originel, provoquant des
          # rejets de push non-fast-forward. On commite directement avec '[skip ci]'.
          git add .
          git commit -m "chore(release): 🔖 Version $NEW_TAG [skip ci]"
          git tag $NEW_TAG
          git push origin $CURRENT_BRANCH
          git push origin $NEW_TAG

          # 3. Fusion de la version de release vers la branche de développement
          git switch develop
          git pull origin develop --rebase
          git merge $CURRENT_BRANCH -m "chore(release): 🔀 Merge $CURRENT_BRANCH to develop [skip ci]"

          # 4. Mise à jour vers la nouvelle version SNAPSHOT sur develop
          poetry version $NEW_SNAPSHOT_TAG || sed -i "s#^version = \".*\"#version = \"$NEW_SNAPSHOT_TAG\"#g" pyproject.toml
          sed -i "s#Version: [0-9]\+\.[0-9]\+\.[0-9]\+\(-SNAPSHOT\)\?#Version: $NEW_SNAPSHOT_TAG#g" README.md

          git add .
          git commit -m "chore(release): 🔖 Version $NEW_SNAPSHOT_TAG [skip ci]"

          # 5. Création et fusion automatique d'une Pull Request pour 'develop' afin de respecter les règles de protection
          TEMP_BRANCH="release-snapshot-$NEW_SNAPSHOT_TAG"
          git checkout -b $TEMP_BRANCH
          git push origin $TEMP_BRANCH

          # Création de la Pull Request
          gh pr create \
            --title "chore(release): 🔖 Version $NEW_SNAPSHOT_TAG [skip ci]" \
            --body "Fusion automatique de la version de release et incrément SNAPSHOT." \
            --base develop \
            --head $TEMP_BRANCH

          # 6. Fusion ou activation de l'auto-merge de la Pull Request
          echo "Tentative de fusion de la PR..."
          if gh pr merge --merge --admin --delete-branch || gh pr merge --merge --delete-branch; then
            echo "La PR a été fusionnée avec succès."
          else
            echo "Impossible de fusionner immédiatement (ex: validations requises). Tentative d'activation de l'auto-merge..."
            if gh pr merge --auto --merge --delete-branch; then
              echo "L'auto-merge a été activé. La PR sera fusionnée automatiquement dès que les validations requises seront passées."
            else
              echo "::warning:: L'auto-merge n'a pas pu être activé. La PR devra être validée et fusionnée manuellement."
            fi
          fi

      # Publication de la release officielle sur GitHub
      - name: "Create the GitHub release"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.calculate-version.outputs.releaseVersion }}
          generate_release_notes: true
          token: ${{ secrets.TOKEN_GITHUB_FOR_GITHUB_ACTION }}
